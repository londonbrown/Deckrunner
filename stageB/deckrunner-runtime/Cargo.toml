[package]
name = "deckrunner-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Stage B: SK8V's unchanged Skate session behind a small C ABI for the Cyberpunk lab plugin (host-supplied triangles)"

[lib]
name = "deckrunner_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
skate-host = { path = "../../deps/deckrunner-engine/build/overlay/skate/crates/skate-host" }
skatev-runtime = { path = "../../deps/deckrunner-engine/rust/skatev-runtime" }
bevy_math = "0.19"
serde_json = "1"

[profile.release]
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
