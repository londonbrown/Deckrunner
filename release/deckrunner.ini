; Deckrunner settings. The plugin file ships this as deckrunner.default.ini and makes deckrunner.ini from it the first
; time the game starts, so updates never overwrite your settings.
; Setup builds data\ beside this file from your own Skate 3 disc and Cyberpunk 2077 install.

; Skate 3's sound. volume: 1.0 is the default; 0 or enabled=0 turns it off.
[audio]
volume=1.0

; Skate 3's difficulty: easy, normal, hardcore or motorized. Easy (the default) helps tricks land, e.g. it catches an
; over-rotated flip. Normal and hardcore are Skate 3's stricter handling. Motorized drives the board for you, and bad
; landings never bail. Takes effect the next time you start skating.
[skate]
difficulty=easy

; Keys. Modifiers (Ctrl, Shift, Alt) and one key joined with +, e.g. Ctrl+Shift+F10, Alt+K, Ctrl+Num7.
; Keys: F1-F24, A-Z, 0-9, Num0-Num9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, Backspace, Tab,
; Enter, Space, Up, Down, Left, Right. Not F5 or F9: the game quick-saves and quick-loads on them.
[keys]
; Start and stop skating.
skate=Ctrl+Shift+F10
; Save the last few seconds of a ride for a bug report.
capture=Ctrl+Shift+F12
