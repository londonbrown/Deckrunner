# Builds the Deckrunner release from source with tools/release/ci-build.ps1 (run that locally to check a build first)
# and, for a version tag (v1.2.3), publishes it as a GitHub release with release/notes/<version>.md as its notes. Run
# the workflow by hand (Actions > Release > Run workflow) to build without publishing: the zip is kept as an artifact.
#
# Everything comes from this repository and its submodules: deps/deckrunner-engine (Deckrunner's fork of SK8V, whose
# pinned upstreams are Deckrunner's forks too) and deps/RED4ext.SDK. WolvenKit's console release (for compiling wkprobe)
# is downloaded at the version and SHA-256 the player's setup pins.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the test build (nothing is published)
        default: 0.0.0-ci

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # The repository's own files are protected by .gitattributes; this covers the submodules too.
      - name: Byte-exact checkouts
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # DKR_VERSION, not VERSION: MSBuild would take VERSION as wkprobe's assembly version.
      - name: Version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          "DKR_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not (Test-Path "release/notes/$v.md")) { throw "release/notes/$v.md is missing" }

      # Caches (ci-build.ps1 works in runner.temp/work): the engine's pinned upstreams (keyed by its lock), Cargo's
      # crate downloads and the runtime's build (keyed by the lock file; the build cache is saved every run and
      # restored from the newest), and the WolvenKit zip (keyed by its pin, and hash-checked after a restore too).
      - name: Cache engine upstreams
        uses: actions/cache@v4
        with:
          path: deps/deckrunner-engine/upstream
          key: engine-upstream-${{ hashFiles('deps/deckrunner-engine/upstreams.lock.json') }}

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ hashFiles('stageB/deckrunner-runtime/Cargo.lock') }}
          restore-keys: cargo-home-

      - name: Cache runtime build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/cargo
          key: cargo-target-${{ hashFiles('tools/release/ci-build.ps1', 'stageB/deckrunner-runtime/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ hashFiles('tools/release/ci-build.ps1', 'stageB/deckrunner-runtime/Cargo.lock') }}-

      - name: Cache WolvenKit
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/wolvenkit.zip
          key: wolvenkit-10.0.0-beta.1-292185c2f51d1ca85b95e1a7ca63a2d1bc8a3fc5ee387275e9a42ec78103155e

      - name: Build
        run: ./tools/release/ci-build.ps1 -Version $env:DKR_VERSION -Work "$env:RUNNER_TEMP/work"

      - uses: actions/upload-artifact@v4
        with:
          name: Deckrunner-${{ env.DKR_VERSION }}
          path: build/release/Deckrunner-${{ env.DKR_VERSION }}.zip

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:DKR_VERSION.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME "build/release/Deckrunner-$env:DKR_VERSION.zip" `
            --title "Deckrunner $env:DKR_VERSION" --notes-file "release/notes/$env:DKR_VERSION.md" @pre
