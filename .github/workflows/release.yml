# Builds the Deckrunner release from source and, for a version tag (v1.2.3), publishes it as a GitHub release with
# release/notes/<version>.md as its notes. Run it by hand (Actions > Release > Run workflow) to build without
# publishing: the zip is then kept as a workflow artifact.
#
# Everything comes from this repository and its submodules: deps/deckrunner-engine (Deckrunner's fork of SK8V, whose
# pinned upstreams are Deckrunner's forks too) and deps/RED4ext.SDK. WolvenKit's console release (for compiling wkprobe)
# is downloaded at the version and SHA-256 the player's setup pins.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the test build (nothing is published)
        default: 0.0.0-ci

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.98.1
  WOLVENKIT_URL: https://github.com/WolvenKit/WolvenKit/releases/download/10.0.0-beta.1/WolvenKit.Console-10.0.0-beta.1.zip
  WOLVENKIT_SHA256: 292185c2f51d1ca85b95e1a7ca63a2d1bc8a3fc5ee387275e9a42ec78103155e

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not (Test-Path "release/notes/$v.md")) { throw "release/notes/$v.md is missing" }

      - name: Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - name: Skate engine sources (from Deckrunner's forks)
        run: |
          ./deps/deckrunner-engine/tools/fetch-upstreams.ps1
          ./deps/deckrunner-engine/tools/prepare-skate-overlay.ps1

      - name: WolvenKit (to compile wkprobe against)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wolvenkit.zip'
          Invoke-WebRequest $env:WOLVENKIT_URL -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:WOLVENKIT_SHA256) { throw "WolvenKit zip SHA-256 $sha does not match the pin" }
          $dir = Join-Path $env:RUNNER_TEMP 'wolvenkit'
          Expand-Archive $zip $dir
          "WOLVENKIT_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Plugin
        run: |
          cmake -S stageA/probe -B "$env:RUNNER_TEMP/probe" -A x64
          cmake --build "$env:RUNNER_TEMP/probe" --config Release --target deckrunner_probe

      - name: Runtime
        working-directory: stageB/deckrunner-runtime
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=src -C link-arg=/PDBALTPATH:%_PDB%"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP/cargo"
          cargo build --release --locked

      - name: Package
        run: |
          python tools/release/build-release.py --version $env:VERSION `
            --plugin-dll "$env:RUNNER_TEMP/probe/Release/deckrunner_probe.dll" `
            --runtime-dll "$env:RUNNER_TEMP/cargo/release/deckrunner_runtime.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: Deckrunner-${{ env.VERSION }}
          path: build/release/Deckrunner-${{ env.VERSION }}.zip

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:VERSION.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME "build/release/Deckrunner-$env:VERSION.zip" `
            --title "Deckrunner $env:VERSION" --notes-file "release/notes/$env:VERSION.md" @pre
